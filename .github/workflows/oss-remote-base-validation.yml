name: OSS remote-base validation
on:
  push:
    branches: [test/remote-base-active-validation-20261004]
permissions:
  contents: read
concurrency:
  group: oss-remote-base-active-validation-20261004
  cancel-in-progress: true
env:
  CI: true
  TAKT_E2E_PROVIDER: mock
  TAKT_AUTO_PR: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 1aa856b003e94bc5bb7c1f3c5dd8f24e91a8e363
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Previous public clone units
        run: npm test -- src/__tests__/clone.test.ts src/__tests__/clone-base-branch.test.ts
      - name: Real Git submodule regression is red on previous public head
        run: |
          git show cdbaa86c7bf280243cb3e3cea6fd69fd495dc227:src/__tests__/it-clone-remote-base.test.ts > src/__tests__/it-clone-remote-base.test.ts
          git show cdbaa86c7bf280243cb3e3cea6fd69fd495dc227:tsconfig.tests.json > tsconfig.tests.json
          git diff --exit-code -- src/infra/task/clone.ts src/infra/task/clone-exec.ts scripts
          set +e
          npm test -- src/__tests__/it-clone-remote-base.test.ts --reporter=json --outputFile="$RUNNER_TEMP/remote-base-red.json"
          regression_exit=$?
          set -e
          test "$regression_exit" -eq 1
          node -e 'const fs=require("node:fs");const assert=require("node:assert/strict");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/remote-base-red.json","utf8"));assert.equal(r.numFailedTests,2);assert.equal(r.numPassedTests,16);const failures=r.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==="failed");assert(failures.every(t=>t.fullName.includes("preserves selected paths for subsequent updates without path arguments")));assert(failures.every(t=>t.failureMessages.join(" ").includes("expected true to be false")));console.log("Confirmed two subsequent updates initialize excluded submodules; sixteen controls pass on previous public head");'
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cdbaa86c7bf280243cb3e3cea6fd69fd495dc227
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Run integration classification alone
        run: npm test -- src/__tests__/releaseVerificationWiring.test.ts
      - name: Run new heavy real Git integration alone
        run: npm test -- src/__tests__/it-clone-remote-base.test.ts
      - name: Complete unit gate with bounded parallelism
        run: npm test -- --maxWorkers=2
      - run: npm run test:it -- --maxWorkers=2
      - name: Install SDK-matched runtime for free local mock probes
        run: |
          probe_runtime_dir="$RUNNER_TEMP/takt-opencode"
          npm install --prefix "$probe_runtime_dir" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund opencode-linux-x64@1.18.28
          printf '%s\n' "$probe_runtime_dir/node_modules/opencode-linux-x64/bin" >> "$GITHUB_PATH"
      - run: npm run test:opencode-probe
      - run: npm run test:e2e:smoke
      - name: Confirm tested source stayed unchanged
        run: git diff --exit-code
